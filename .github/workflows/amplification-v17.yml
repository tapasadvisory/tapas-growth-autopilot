name: Owned-channel amplification tests
on:
  push:
    branches: [feature/owned-channel-amplification-v17]
  pull_request:
    paths:
      - "services/**"
      - "server.py"
      - "test_*"
      - ".github/workflows/amplification-v17.yml"
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run offline integration tests (no provider calls)
        env:
          AUTO_PUBLISH_DRY_RUN: "true"
        run: |
          python -m unittest -v test_owned_channel_publisher_v17
          python -m unittest -v test_v15_autopublish
          python -m unittest -v test_publication_orchestrator_v16
          python -m unittest -v test_smoke
