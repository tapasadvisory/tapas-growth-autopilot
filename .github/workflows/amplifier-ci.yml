name: Tapas Content Amplifier CI
on:
  push:
    paths: ['amplifier/**','.github/workflows/amplifier-ci.yml']
  pull_request:
    paths: ['amplifier/**','.github/workflows/amplifier-ci.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tests
        run: python -m unittest discover -s amplifier/tests -v
