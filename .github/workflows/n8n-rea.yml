name: n8n REA workflow contract
on:
  push:
    paths:
      - "n8n/**"
      - "test_n8n_workflow.py"
      - ".github/workflows/n8n-rea.yml"
  pull_request:
    paths:
      - "n8n/**"
      - "test_n8n_workflow.py"
      - ".github/workflows/n8n-rea.yml"
permissions:
  contents: read
jobs:
  workflow-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate n8n workflow JSON and read-only contract
        run: python -m unittest -v test_n8n_workflow
